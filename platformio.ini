; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
;   sumo         - the competition firmware (default)
;   sensor_test  - prints ultrasonic + IR readings to the serial monitor
;   motor_test   - steps through each motor direction to check wiring

[platformio]
default_envs = sumo

[env]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h

[env:sumo]
build_src_filter = +<*> -<tests/>

[env:sensor_test]
build_src_filter = +<tests/sensor_test.cpp> +<sensors.cpp> +<motors.cpp>

[env:motor_test]
build_src_filter = +<tests/motor_test.cpp> +<motors.cpp>
